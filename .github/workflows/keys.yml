name: Refresh Upstox Keys

on:
  schedule:
    - cron: '0 3 * * 1-5'   # roz 8:30 AM IST (UTC mein 3:00), Mon-Fri
  workflow_dispatch:

jobs:
  keys:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      - name: KEYS tab refresh
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: python build_keys.py
