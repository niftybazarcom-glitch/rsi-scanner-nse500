name: EMA Scanner

on:
  schedule:
    # Times UTC mein hain (IST = UTC + 5:30), sirf Mon-Fri
    - cron: '38 3 * * 1-5'            # prep: 9:08 AM IST (stocks ki list, price/circuit filter, purani candles)
    - cron: '2,17,32,47 4-9 * * 1-5'  # scan: 9:32 se 3:17 PM IST, har 15 minute (candle band hone ke baad)
    - cron: '2 10 * * 1-5'            # scan: 3:32 PM IST (aakhri candle)
  workflow_dispatch:
    inputs:
      mode:
        description: 'prep = list banao, scan = signal dhundo'
        type: choice
        default: scan
        options: [prep, scan]
      force:
        description: 'Market time ka check ignore karo (sirf testing ke liye)'
        type: boolean
        default: false

concurrency:
  group: ema-scanner
  cancel-in-progress: false

jobs:
  ema:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Aaj ki date (IST)
        id: d
        run: echo "date=$(TZ=Asia/Kolkata date +%F)" >> "$GITHUB_OUTPUT"

      - name: EMA cache
        uses: actions/cache@v4
        with:
          path: ema_cache.json.gz
          key: ema-cache-${{ steps.d.outputs.date }}

      - name: EMA scanner chalao
        env:
          UPSTOX_TOKEN: ${{ secrets.UPSTOX_TOKEN }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event.schedule == '38 3 * * 1-5' && 'prep' || 'scan') }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force || 'false' }}
        run: python ema_scanner.py
